<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Page not found | {{BUSINESS_NAME}}</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--p:{{BRAND_PRIMARY|#FF5733}};--d:{{BRAND_DARK|#1A1A1B}};--l:{{BRAND_LIGHT|#F7F7F7}}}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,sans-serif;background:var(--l);color:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
    h1{font-family:Syne,sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3rem)}
    p{margin-top:1rem;color:#555;max-width:440px;line-height:1.65}
    a{display:inline-block;margin-top:1.75rem;background:var(--p);color:#fff;font-family:Syne,sans-serif;font-weight:800;padding:.75rem 1.5rem;border-radius:8px;text-decoration:none}
    a:hover{filter:brightness(.95)}
    code{font-size:.85rem;color:#666}
  </style>
</head>
<body>
  <p><strong>404</strong></p>
  <h1>That page isn’t here.</h1>
  <p>{{ERROR_404_MESSAGE}}</p>
  <p><code>{{SITE_URL}}</code></p>
  <a href="index.html">Back to home</a>
  <script src="./main.js" defer></script>
</body>
</html>
